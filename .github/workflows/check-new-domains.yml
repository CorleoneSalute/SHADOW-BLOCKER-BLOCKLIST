- name: Run new domain check
        run: python3 scripts/check_new_domains.py

      - name: Commit report and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "chore: update new domain suggestions [skip ci]"
          git push
